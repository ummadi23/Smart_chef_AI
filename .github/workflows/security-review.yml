name: "Smart Chef AI Security Review Pipeline"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_dast:
        description: "Run live DAST API tests"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # Job 1: Detect backend technology stack
  detect-stack:
    name: "Detect Backend Technology Stack"
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.detect.outputs.stack }}
      has_package_json: ${{ steps.detect.outputs.has_package_json }}

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Detect Technology Stack"
        id: detect
        run: |
          STACK="unknown"
          HAS_PKG="false"
          if [ -f "backend/package.json" ]; then
            STACK="nodejs-express"
            HAS_PKG="true"
            echo "Detected: Node.js / Express"
          elif [ -f "requirements.txt" ]; then
            STACK="python"
            echo "Detected: Python"
          elif [ -f "pom.xml" ]; then
            STACK="java-spring"
            echo "Detected: Java/Spring"
          elif [ -f "go.mod" ]; then
            STACK="golang"
            echo "Detected: Go"
          fi
          echo "stack=$STACK" >> "$GITHUB_OUTPUT"
          echo "has_package_json=$HAS_PKG" >> "$GITHUB_OUTPUT"

  # Job 2: Secret scanning with Gitleaks + manual checks
  secret-scan:
    name: "Secret Scanning (Gitleaks + Custom)"
    runs-on: ubuntu-latest
    needs: detect-stack
    permissions:
      contents: read
      security-events: write

    steps:
      - name: "Checkout Code (Full History)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Run Gitleaks Secret Detection"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: "Custom Secret Pattern Scan"
        run: |
          mkdir -p security-reports
          REPORT="security-reports/secret-scan.txt"
          ISSUES=0
          echo "Smart Chef AI - Secret Scan Results - $(date)" > $REPORT

          # Check JWT fallback hardcoded secret
          if grep -rn "SECRET_SESSION_KEY" backend/ --include="*.js" 2>/dev/null; then
            echo "CRITICAL: Hardcoded JWT fallback secret found" >> $REPORT
            ISSUES=$((ISSUES+1))
          fi

          # Check for demo API key
          if grep -rn "apikey=helloworld" backend/ --include="*.js" 2>/dev/null; then
            echo "MEDIUM: OCR.space public demo key helloworld found" >> $REPORT
            ISSUES=$((ISSUES+1))
          fi

          # Check GOOGLE_AUTH_SECRET fallback
          if grep -rn "GOOGLE_AUTH_SECRET" backend/ --include="*.js" 2>/dev/null; then
            echo "HIGH: Predictable Google auth fallback password found" >> $REPORT
            ISSUES=$((ISSUES+1))
          fi

          # Check .env in git history
          if git log --all --oneline -- "backend/.env" 2>/dev/null | grep -q "."; then
            echo "CRITICAL: .env file found in git history - credentials exposed" >> $REPORT
            ISSUES=$((ISSUES+1))
          fi

          # Check .gitignore
          if ! grep -q "\.env" "backend/.gitignore" 2>/dev/null; then
            echo "LOW: .env not in .gitignore" >> $REPORT
            ISSUES=$((ISSUES+1))
          fi

          echo "Total secret issues: $ISSUES" >> $REPORT
          cat $REPORT
          echo "secret_issues=$ISSUES" >> "$GITHUB_ENV"

  # Job 3: SAST static analysis
  sast-analysis:
    name: "SAST Static Code Analysis"
    runs-on: ubuntu-latest
    needs: detect-stack
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: "Install Backend Dependencies"
        run: |
          cd backend
          npm ci --ignore-scripts

      - name: "Semgrep SAST Scan"
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/nodejs
            p/javascript
            p/security-audit
            p/owasp-top-ten
            p/jwt
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: "Custom Security Rule Checks"
        run: |
          mkdir -p security-reports
          REPORT="security-reports/sast-custom.txt"
          CRITICAL=0
          HIGH=0
          MEDIUM=0
          echo "Smart Chef AI - Custom SAST Results - $(date)" > $REPORT

          # C1: Missing JWT middleware
          if ! grep -rn "jwt.verify\|verifyToken\|req\.user" backend/routes/ --include="*.js" 2>/dev/null | grep -v "//"; then
            echo "CRITICAL: No JWT authentication middleware found in routes" >> $REPORT
            CRITICAL=$((CRITICAL+1))
          fi

          # C2: JWT fallback secret
          if grep -rn "SECRET_SESSION_KEY" backend/ --include="*.js" 2>/dev/null; then
            echo "CRITICAL: Hardcoded JWT fallback secret" >> $REPORT
            CRITICAL=$((CRITICAL+1))
          fi

          # C3: Password reset no verification
          if grep -n "reset-password" backend/routes/auth.js 2>/dev/null | grep -q "router.post"; then
            if ! grep -A 30 "reset-password" backend/routes/auth.js 2>/dev/null | grep -q "token\|otp\|verify"; then
              echo "CRITICAL: Password reset has no token/OTP verification" >> $REPORT
              CRITICAL=$((CRITICAL+1))
            fi
          fi

          # H1: Wildcard CORS
          if grep -n "app.use(cors())" backend/index.js 2>/dev/null; then
            echo "HIGH: Wildcard CORS (Access-Control-Allow-Origin: *)" >> $REPORT
            HIGH=$((HIGH+1))
          fi

          # H2: Multer no validation
          if grep -rn "multer({" backend/ --include="*.js" 2>/dev/null | grep -v "fileFilter"; then
            echo "HIGH: Multer without fileFilter - arbitrary file upload" >> $REPORT
            HIGH=$((HIGH+1))
          fi

          # H3: No rate limiting
          if ! grep -rn "rate-limit\|rateLimit\|express-rate-limit" backend/ --include="*.js" 2>/dev/null; then
            echo "HIGH: No rate limiting - brute-force vulnerability" >> $REPORT
            HIGH=$((HIGH+1))
          fi

          # H4: Large body limit
          if grep -n "50mb" backend/index.js 2>/dev/null; then
            echo "HIGH: 50MB global body limit is DoS vector" >> $REPORT
            HIGH=$((HIGH+1))
          fi

          # M1: Error message leakage
          if grep -rn "error\.message\|err\.message" backend/routes/ --include="*.js" 2>/dev/null | grep "res\."; then
            echo "MEDIUM: Raw error messages returned to clients" >> $REPORT
            MEDIUM=$((MEDIUM+1))
          fi

          # M2: Missing helmet
          if ! grep -rn "helmet" backend/ --include="*.js" 2>/dev/null; then
            echo "MEDIUM: Helmet.js not found - security headers missing" >> $REPORT
            MEDIUM=$((MEDIUM+1))
          fi

          # M3: Math.random for IDs
          if grep -rn "Math.random()" backend/localDb.js 2>/dev/null; then
            echo "MEDIUM: Math.random() used for ID generation" >> $REPORT
            MEDIUM=$((MEDIUM+1))
          fi

          # M4: OCR demo key
          if grep -rn "helloworld" backend/ --include="*.js" 2>/dev/null; then
            echo "MEDIUM: OCR.space public demo key detected" >> $REPORT
            MEDIUM=$((MEDIUM+1))
          fi

          echo "" >> $REPORT
          echo "SUMMARY - Critical: $CRITICAL | High: $HIGH | Medium: $MEDIUM" >> $REPORT
          cat $REPORT
          echo "critical_count=$CRITICAL" >> "$GITHUB_ENV"
          echo "high_count=$HIGH" >> "$GITHUB_ENV"
          echo "medium_count=$MEDIUM" >> "$GITHUB_ENV"

      - name: "Fail on Critical Issues"
        run: |
          CRITICAL=${{ env.critical_count || 0 }}
          if [ "$CRITICAL" -gt "0" ]; then
            echo "BUILD FAILED: $CRITICAL Critical security vulnerabilities detected"
            exit 1
          fi
          echo "PASS: No Critical vulnerabilities"

  # Job 4: Dependency vulnerability scanning
  dependency-scan:
    name: "Dependency Vulnerability Scan (npm audit + Trivy)"
    runs-on: ubuntu-latest
    needs: detect-stack
    permissions:
      contents: read
      security-events: write

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Install Dependencies"
        run: |
          cd backend
          npm ci --ignore-scripts

      - name: "npm audit Vulnerability Check"
        run: |
          mkdir -p security-reports
          cd backend
          npm audit 2>&1 | tee ../security-reports/npm-audit.txt || true
          npm audit --audit-level=critical 2>&1 || true

      - name: "Trivy Filesystem Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./backend"
          format: "sarif"
          output: "security-reports/trivy-results.sarif"
          severity: "HIGH,CRITICAL"
        continue-on-error: true

      - name: "Upload Trivy SARIF"
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "security-reports/trivy-results.sarif"
        continue-on-error: true

      - name: "Dependency Configuration Check"
        run: |
          node -e "
          const pkg = require('./backend/package.json');
          const devInProd = ['nodemon','mongodb-memory-server'];
          const found = devInProd.filter(p => Object.keys(pkg.dependencies || {}).includes(p));
          if (found.length > 0) console.warn('WARNING: Dev tools in prod deps:', found.join(', '));
          else console.log('OK: No dev tools in prod deps');
          const unpinned = Object.keys(pkg.dependencies || {}).filter(k => /^[\\^~]/.test(pkg.dependencies[k]));
          console.log('Unpinned deps:', unpinned.length, '-', unpinned.slice(0,5).join(', '));
          " | tee -a security-reports/dep-config.txt

  # Job 5: Live API security tests (DAST)
  api-security-check:
    name: "API Security Tests (DAST)"
    runs-on: ubuntu-latest
    needs: [detect-stack, sast-analysis]

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Install Backend"
        run: |
          cd backend
          npm ci --ignore-scripts

      - name: "Start Backend Server"
        run: |
          cd backend
          node index.js &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          sleep 8
        env:
          JWT_SECRET: "ci-test-secret-not-for-production-only"
          PORT: "5000"

      - name: "Run API Security Tests"
        run: |
          mkdir -p security-reports
          BASE="http://localhost:5000"
          REPORT="security-reports/api-dast.txt"
          ISSUES=0
          echo "API Security Tests - $(date)" > $REPORT

          # Test: Unauthenticated password reset
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/api/auth/reset-password" \
            -H "Content-Type: application/json" \
            -d '{"email":"test@test.com","newPassword":"test12345"}' 2>/dev/null || echo "000")
          echo "Unauthenticated password reset: HTTP $CODE" >> $REPORT
          if [ "$CODE" = "200" ] || [ "$CODE" = "404" ]; then
            echo "  FAIL: Accepts unauthenticated password reset" >> $REPORT
            ISSUES=$((ISSUES+1))
          fi

          # Test: Community create without auth
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/api/community/create" \
            -H "Content-Type: application/json" \
            -d '{"username":"hacker","recipeTitle":"Test","imageUrl":"http://evil.com"}' 2>/dev/null || echo "000")
          echo "Community create without auth: HTTP $CODE" >> $REPORT
          if [ "$CODE" != "401" ] && [ "$CODE" != "403" ] && [ "$CODE" != "000" ]; then
            echo "  FAIL: Accepts unauthenticated post creation" >> $REPORT
            ISSUES=$((ISSUES+1))
          fi

          # Test: CORS wildcard
          CORS=$(curl -s -I -H "Origin: https://evil-attacker.com" "$BASE/" 2>/dev/null | grep -i "access-control-allow-origin" || echo "")
          echo "CORS header: $CORS" >> $REPORT
          if echo "$CORS" | grep -q "\*"; then
            echo "  FAIL: Wildcard CORS detected" >> $REPORT
            ISSUES=$((ISSUES+1))
          fi

          # Test: Security headers presence
          HEADERS=$(curl -s -I "$BASE/" 2>/dev/null)
          for H in "X-Content-Type-Options" "X-Frame-Options" "Strict-Transport-Security"; do
            if echo "$HEADERS" | grep -qi "$H"; then
              echo "  PASS: $H present" >> $REPORT
            else
              echo "  FAIL: $H missing" >> $REPORT
              ISSUES=$((ISSUES+1))
            fi
          done

          # Test: Brute-force rate limiting
          HIT_LIMIT="false"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE/api/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"test@test.com","password":"wrongpass"}' 2>/dev/null || echo "000")
            if [ "$CODE" = "429" ]; then
              echo "Rate limit triggered at attempt $i" >> $REPORT
              HIT_LIMIT="true"
              break
            fi
          done
          if [ "$HIT_LIMIT" = "false" ]; then
            echo "  FAIL: No rate limiting on login after 12 attempts" >> $REPORT
            ISSUES=$((ISSUES+1))
          fi

          echo "Total DAST issues: $ISSUES" >> $REPORT
          cat $REPORT

      - name: "Stop Backend Server"
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true

  # Job 6: Publish GitHub Actions summary and upload reports
  security-report:
    name: "Generate Security Report & Summary"
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-analysis, dependency-scan, api-security-check]
    if: always()

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Publish GitHub Step Summary"
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # Smart Chef AI Security Assessment Results

          ## Findings Summary

          | Severity | Count | Action |
          |---|---|---|
          | CRITICAL | 5 | Immediate action required |
          | HIGH | 6 | Fix within 1 week |
          | MEDIUM | 10 | Fix within 1 month |
          | LOW | 4 | Next maintenance cycle |
          | **Total** | **25** | |

          ## Overall Security Score: 18/100 — FAILING

          ## Critical Findings (Must Fix Before Deploy)

          1. **C-001** — Live MongoDB, OpenAI, JWT, Gemini credentials in committed `.env` file
          2. **C-002** — Zero JWT authentication middleware — all write/delete endpoints publicly accessible
          3. **C-003** — Password reset with no OTP/verification — any email enables account takeover
          4. **C-004** — Hardcoded fallback JWT secret `SECRET_SESSION_KEY`
          5. **C-005** — SSRF via unvalidated YouTube URL in analyze-youtube endpoint

          ## Immediate Remediation Steps

          1. Rotate ALL credentials immediately
          2. Add `.env` to `.gitignore` and purge from Git history
          3. Create JWT middleware and apply to all protected routes
          4. Add OTP/token verification to password reset flow
          5. Add express-rate-limit to auth endpoints
          6. Replace wildcard CORS with explicit origin list
          7. Add helmet() for security headers
          8. Fix Multer file type validation

          > Full reports in the Artifacts tab
          EOF

      - name: "Upload Security Report Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "SmartChefAI-Security-Assessment-${{ github.sha }}"
          path: |
            Vulnerability Test Results/
            security-reports/
          retention-days: 90
          if-no-files-found: warn

  # Job 7: Security gate — fails ONLY on Critical
  security-gate:
    name: "Security Gate (Fail on Critical)"
    runs-on: ubuntu-latest
    needs: [sast-analysis, dependency-scan, api-security-check]
    if: always()

    steps:
      - name: "Evaluate Security Gate"
        run: |
          echo "SAST Result:        ${{ needs.sast-analysis.result }}"
          echo "Dependency Result:  ${{ needs.dependency-scan.result }}"
          echo "API Security:       ${{ needs.api-security-check.result }}"

          if [ "${{ needs.sast-analysis.result }}" = "failure" ]; then
            echo ""
            echo "SECURITY GATE FAILED"
            echo "Critical vulnerabilities detected. PR cannot be merged."
            echo "Review the SAST findings in the Artifacts tab."
            exit 1
          fi

          echo ""
          echo "SECURITY GATE PASSED"
          echo "No Critical vulnerabilities blocking this merge."
          echo "High/Medium/Low findings require remediation per SLA."
